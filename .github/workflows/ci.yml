name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --locked
      - name: smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./target/debug/hone.exe; else BIN=./target/debug/hone; fi
          "$BIN" examples/hello.hn
          "$BIN" examples/fib.hn

  termux:
    name: cross-compile aarch64 (Termux / musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-musl
      # .cargo/config.toml 里的 linker 是开发机本机绝对路径，CI 上改用工具链自带的 rust-lld
      - name: build
        run: cargo build --release --locked --target aarch64-unknown-linux-musl --config 'target.aarch64-unknown-linux-musl.linker="rust-lld"'
