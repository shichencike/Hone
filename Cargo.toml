[package]
name = "zap"
version = "0.1.0"
edition = "2021"
description = "Zap - 轻量级、跨平台、可嵌入的脚本语言（单文件解释器）"
license = "MIT"

[[bin]]
name = "zap"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = "z"
strip = true
debug = false
panic = "abort"
codegen-units = 1

[dependencies]
serde_json = "1"
libloading = "0.7"
regex = "1"
md-5 = "0.10"
sha2 = "0.10"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winbase", "winreg", "synchapi", "errhandlingapi"] }
