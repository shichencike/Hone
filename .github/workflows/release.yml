name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hone-linux-x86_64
            cmd: cargo build --release --locked --target x86_64-unknown-linux-gnu
          - name: termux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: hone-termux-aarch64
            cmd: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hone-windows-x86_64.exe
            cmd: cargo build --release --locked --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Termux(musl) 目标用 zig 链接：rust-lld 在 aarch64-musl 上缺 libdl（-ldl 解析失败），
      # zig 自带 musl libc 存根可正常链接；其余平台用原生 cargo build。
      - name: Install zig
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: goto-bus-stop/setup-zig@v2
      - name: Install cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cargo-zigbuild --locked
      - name: build release
        shell: bash
        run: ${{ matrix.cmd }}
      - name: copy artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hone.exe" "dist/${{ matrix.artifact }}" 2>/dev/null || cp "target/${{ matrix.target }}/release/hone" "dist/${{ matrix.artifact }}"
      - name: sha256
        shell: bash
        run: |
          cd dist
          sha256sum "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  publish:
    name: publish release + homebrew + scoop
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: package assets
        run: |
          set -e
          mkdir -p dist/pkg
          cp "dist/hone-linux-x86_64/hone-linux-x86_64" "dist/pkg/hone-linux-x86_64"
          tar -czf "dist/pkg/hone-linux-x86_64.tar.gz" -C "dist/hone-linux-x86_64" "hone-linux-x86_64"
          cp "dist/hone-termux-aarch64/hone-termux-aarch64" "dist/pkg/hone-termux-aarch64"
          tar -czf "dist/pkg/hone-termux-aarch64.tar.gz" -C "dist/hone-termux-aarch64" "hone-termux-aarch64"
          cp "dist/hone-windows-x86_64/hone-windows-x86_64.exe" "dist/pkg/hone-windows-x86_64.exe"
          cp install.sh "dist/pkg/install.sh"
          cp install.ps1 "dist/pkg/install.ps1"
          cd dist/pkg
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pkg/*
          generate_release_notes: true

      # 以下两步需要预先配置：新建 tap/bucket 仓库 + 仓库 Secrets 里添加 TAP_TOKEN（PAT，权限 repo）
      # 未配置 TAP_TOKEN 时自动跳过，不影响 Releases 发布
      - name: update Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -e
          SHA=$(grep 'hone-linux-x86_64.tar.gz' dist/pkg/checksums.txt | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/shichencike/homebrew-hone.git" tap
          cat > tap/hone.rb <<EOF
          class Hone < Formula
            desc "轻量级、跨平台、可嵌入的脚本语言"
            homepage "https://github.com/shichencike/Hone"
            url "https://github.com/shichencike/Hone/releases/download/${GITHUB_REF_NAME}/hone-linux-x86_64.tar.gz"
            sha256 "${SHA}"
            version "${GITHUB_REF_NAME#v}"
            def install
              bin.install "hone-linux-x86_64" => "hone"
            end
          end
          EOF
          cd tap
          git config user.email "hone-ci@users.noreply.github.com"
          git config user.name "hone-ci"
          git add hone.rb
          git commit -m "hone ${GITHUB_REF_NAME}"
          git push

      - name: update Scoop bucket
        if: env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -e
          SHA=$(grep 'hone-windows-x86_64.exe' dist/pkg/checksums.txt | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/shichencike/scoop-hone.git" bucket
          cat > bucket/hone.json <<EOF
          {
            "version": "${GITHUB_REF_NAME#v}",
            "description": "轻量级、跨平台、可嵌入的脚本语言",
            "homepage": "https://github.com/shichencike/Hone",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "https://github.com/shichencike/Hone/releases/download/${GITHUB_REF_NAME}/hone-windows-x86_64.exe",
                "hash": "${SHA}"
              }
            },
            "bin": [["hone-windows-x86_64.exe", "hone"]],
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/shichencike/Hone/releases/download/\$version/hone-windows-x86_64.exe"
                }
              }
            }
          }
          EOF
          cd bucket
          git config user.email "hone-ci@users.noreply.github.com"
          git config user.name "hone-ci"
          git add hone.json
          git commit -m "hone ${GITHUB_REF_NAME}"
          git push
