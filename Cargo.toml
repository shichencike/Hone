[package]
name = "hone"
version = "0.8.0"
edition = "2021"
description = "Hone - 轻量级、跨平台、开箱即用的脚本语言（单文件解释器）"
license = "MIT"

[[bin]]
name = "hone"
path = "src/main.rs"

[workspace]
exclude = ["tests/hone_lib"]

[profile.release]
# 实测（2026-08-14）：fat LTO + 单 codegen unit 在本机最快（3m53s）且体积最小（3.7MB）；
# thin LTO 的两种组合（cgu=1 / cgu=16）反而更慢（4m47s+）且更大（4.0MB+），故保留原配置。
lto = true
opt-level = "z"
strip = true
debug = false
panic = "abort"
codegen-units = 1

# debug（dev）profile：关闭调试符号。debuginfo=2 时 rustc 链接 200MB 级产物，
# 本机与 CI runner（ubuntu/windows/termux，exit 143 / memory allocation failed，
# 2026-10-18）均内存耗尽；回归测试只比对 stdout/stderr 逐字节输出，无需符号。
# codegen-units=1：单 codegen unit 消除代码生成阶段的并行内存峰值。
[profile.dev]
debug = 0
codegen-units = 1

[dependencies]
serde_json = "1"
libloading = "0.7"
# 工业级 FFI：动态调用（CIF，含变参 ffi_prep_cif_var）+ 回调闭包（ffi_closure）。
# 默认（无 system feature）从源码构建 libffi C 库并**静态**链入产物，无系统动态库依赖；
# MSVC 目标经预处理头 + cc 构建（无需 automake/make），GNU/ELF 目标需 make + C 编译器。
libffi-sys = "4.2.2"
regex = "1"
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# TLS：rustls + rustls-rustcrypto（纯 Rust，无 C 依赖），Windows/Linux/Termux 跨平台一致
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
# 证书链构建（自定义验证器注入中间证书用；与 rustls 同版本树）
rustls-webpki = "0.103"
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winbase", "winreg", "synchapi", "errhandlingapi", "winnt", "wincrypt", "libloaderapi", "wingdi", "windef", "minwindef", "commctrl", "shellapi", "commdlg", "objbase", "shobjidl"] }
