name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hone-linux-x86_64
            cmd: cargo build --release --locked --target x86_64-unknown-linux-gnu
          - name: termux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: hone-termux-aarch64
            cmd: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hone-windows-x86_64.exe
            cmd: cargo build --release --locked --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Termux(musl) 目标用 zig 链接：rust-lld 在 aarch64-musl 上缺 libdl（-ldl 解析失败），
      # zig 自带 musl libc 存根可正常链接；其余平台用原生 cargo build。
      - name: Install zig
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: goto-bus-stop/setup-zig@v2
      - name: Install cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cargo-zigbuild --locked
      - name: build release
        shell: bash
        run: ${{ matrix.cmd }}
      - name: copy artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hone.exe" "dist/${{ matrix.artifact }}" 2>/dev/null || cp "target/${{ matrix.target }}/release/hone" "dist/${{ matrix.artifact }}"
      - name: sha256
        shell: bash
        run: |
          cd dist
          sha256sum "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  publish:
    name: publish release + homebrew + scoop
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: package assets
        run: |
          set -e
          mkdir -p dist/pkg
          # download-artifact@v4 的子目录名与产物名一致（windows 产物名带 .exe），
          # 按 basename 复制最稳妥，不受子目录命名影响
          find dist -type f | sort
          find dist -type f -exec cp {} dist/pkg/ \;
          tar -czf "dist/pkg/hone-linux-x86_64.tar.gz" -C "dist/pkg" "hone-linux-x86_64"
          tar -czf "dist/pkg/hone-termux-aarch64.tar.gz" -C "dist/pkg" "hone-termux-aarch64"
          cp install.sh "dist/pkg/install.sh"
          cp install.ps1 "dist/pkg/install.ps1"
          ls -la dist/pkg
          test -f dist/pkg/hone-windows-x86_64.exe
          cd dist/pkg
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pkg/*
          generate_release_notes: true
