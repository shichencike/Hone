name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Windows runner 默认 locale 为 charmap/GBK，强制 Python 以 UTF-8 读写标准流，
  # 避免回归脚本解码 Hone 的 UTF-8 输出时崩溃（配合 regress4.py 的 encoding='utf-8'）。
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: build & smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 极限降级防 OOM：本仓库 rustc 宏展开 + 代码生成内存峰值极高，runner 物理内存
      # 不够（2026-10-18 三平台 build 全灭）。Linux：fallocate 造 12GB swap 让编译器
      # 用硬盘兜底；Windows：页面文件临时调大到 16GB。
      - name: add 12GB swap (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: enlarge pagefile (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $c = Get-CimInstance Win32_ComputerSystem
          if ($c.AutomaticManagedPagefile) {
            Set-CimInstance -InputObject $c -Property @{AutomaticManagedPagefile = $false}
          }
          $pf = Get-CimInstance Win32_PageFileSetting | Select-Object -First 1
          Set-CimInstance -InputObject $pf -Property @{InitialSize = 4096; MaximumSize = 16384}
          "pagefile: initial 4096 MB / max 16384 MB"
      - name: build
        run: cargo build --release --locked -j 1
      - name: cargo test
        run: cargo test --release --locked -j 1
      - name: smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./target/release/hone.exe; else BIN=./target/release/hone; fi
          "$BIN" examples/hello.hn
          "$BIN" examples/fib.hn
      # G3.6：原生编译后端三引擎回归（interp / VM / nat 逐字节；nat 每例单独
      # rustc 链接，16 例约数分钟）。
      # nat 目标：Linux 侧用 musl（设计 §6.3，glibc 不随 hone 分发 CRT）——须先
      # `rustup target add x86_64-unknown-linux-musl`，否则 rustc 报 E0463
      # （can't find crate for `std`）；regress4.py 在本机缺该目标时退回宿主目标。
      - name: nat 三引擎回归 (regress4)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=target/release/hone.exe; else BIN=target/release/hone; fi
          if [ "$RUNNER_OS" = "Linux" ]; then rustup target add x86_64-unknown-linux-musl; fi
          HONE_BIN="$BIN" python tests/regress4.py

  termux:
    name: cross-compile aarch64 (Termux / musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-musl
      # 极限降级防 OOM（同 test job）：runner 内存不够，swap 兜底 + 单线程编译。
      - name: add 12GB swap (ubuntu)
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      # musl 目标用 zig 链接（rust-lld 缺 libdl 会 -ldl 失败）；zig 自带 musl libc 存根
      - uses: goto-bus-stop/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked -j 1
      - name: build
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl -j 1
